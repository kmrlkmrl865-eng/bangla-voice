<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা ভয়েস জেনারেটর</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            color: #333;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #1e3c72;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
            text-align: left;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            outline: none;
        }
        textarea:focus {
            border-color: #2a5298;
        }
        button {
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        audio {
            width: 100%;
            margin-top: 20px;
            display: none;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>বাংলা ভয়েস জেনারেটর</h2>
    <label for="textInput">এখানে আপনার বাংলা টেক্সট লিখুন:</label>
    <textarea id="textInput" placeholder="আপনার মনের বার্তা বা খবরটি এখানে টাইপ করুন..."></textarea>
    
    <button onclick="generateVoice()">ভয়েস জেনারেট ও ডাউনলোড</button>
    
    <div id="status"></div>
    <audio id="audioPlayer" controls></audio>
</div>

<script>
    const API_KEY = "sk_6e2ef3ae45f9eaf140003d8faf7acc770784b3a81b61a4ab";
    const VOICE_ID = "21m00Tcm4TlvDq8ikWAM";

    async function generateVoice() {
        const text = document.getElementById("textInput").value.trim();
        const status = document.getElementById("status");
        const audioPlayer = document.getElementById("audioPlayer");

        if (!text) {
            status.innerText = "দয়া করে কিছু বাংলা টেক্সট লিখুন!";
            return;
        }

        status.style.color = "#1e3c72";
        status.innerText = "ভয়েস তৈরি হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...";
        audioPlayer.style.display = "none";

        try {
            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                method: "POST",
                headers: {
                    "Accept": "audio/mpeg",
                    "Content-Type": "application/json",
                    "xi-api-key": API_KEY
                },
                body: JSON.stringify({
                    text: text,
                    model_id: "eleven_multilingual_v2",
                    voice_settings: {
                        stability: 0.5,
                        similarity_boost: 0.75
                    }
                })
            });

            if (!response.ok) {
                throw new Error("ভয়েস জেনারেট করা সম্ভব হয়নি। লিমিট বা এপিআই কি যাচাই করুন।");
            }

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);
            
            audioPlayer.src = audioUrl;
            audioPlayer.style.display = "block";
            audioPlayer.play();
            status.innerText = "";

        } catch (error) {
            status.style.color = "#e74c3c";
            status.innerText = error.message;
        }
    }
</script>

</body>
</html>
